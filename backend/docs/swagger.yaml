      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, overdue, completed]
        - name: clientId
          in: query
          schema:
            type: string
        - name: createdBy
          in: query
          schema:
            type: string
          description: Worker o'z arendalari uchun
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Arendalar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  rentals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rental"
                  total:
                    type: number
                  page:
                    type: number
                  totalPages:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Rentals]
      summary: Yangi arenda ochish (Admin + Worker)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, items, startDate]
              properties:
                clientId:
                  type: string
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [equipmentId, quantity]
                    properties:
                      equipmentId:
                        type: string
                      quantity:
                        type: number
                      dailyRate:
                        type: number
                startDate:
                  type: string
                  format: date-time
                expectedEndDate:
                  type: string
                  format: date-time
                depositAmount:
                  type: number
                  default: 0
                deliveryLocation:
                  type: object
                  description: Yetkazish joylashuvi (xarita koordinatalari)
                  properties:
                    lat:
                      type: number
                      example: 41.311081
                    lng:
                      type: number
                      example: 69.240562
                    label:
                      type: string
                      example: Chilonzor 5-uy
                note:
                  type: string
      responses:
        "201":
          description: Yaratilgan arenda
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Rental"
        "400":
          description: Equipment yetarli emas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Client yoki equipment topilmadi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

