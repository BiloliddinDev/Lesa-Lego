                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Arenda topilmadi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /payments/{id}:
    delete:
      tags: [Payments]
      summary: To'lovni bekor qilish (Admin only)
      description: >
        To'lov o'chiriladi, Rental.paidAmount qayta hisoblanadi,
        Client.totalDebt yangilanadi, AuditLog yoziladi.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bekor qilindi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: To'lov bekor qilindi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────────────────────
  # Debts
  # ─────────────────────────────────────────────
  /debts:
    get:
      tags: [Debts]
      summary: Qarzdorlar ro'yxati
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, overdue]
        - name: clientId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Qarzdorlar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Debt"
                  total:
                    type: number
                  page:
                    type: number
                  totalPages:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Debts]
      summary: Yangi qarz qayd etish
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDebtInput"
      responses:
        "201":
          description: Yaratilgan qarz
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Debt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /debts/{id}/pay:
    post:
      tags: [Debts]
      summary: Qarzni to'lash (avtomatik Payment yaratiladi)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDebtInput"
      responses:
        "200":
          description: Qarz to'landi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      debt:
                        $ref: "#/components/schemas/Debt"
                      payment:
                        $ref: "#/components/schemas/Payment"
        "400":
          description: Qarz allaqachon to'langan yoki miqdor ko'p
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────────────────────
  # Settings
  # ─────────────────────────────────────────────
  /settings:
    get:
      tags: [Settings]
      summary: Kompaniya sozlamalarini olish (Admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sozlamalar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    patch:
      tags: [Settings]
      summary: Kompaniya sozlamalarini yangilash (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName:
                  type: string
                ownerName:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                inn:
                  type: string
                bankAccount:
                  type: string
                bankName:
                  type: string
                contractTemplate:
                  type: string
                rentalTerms:
                  type: string
      responses:
        "200":
          description: Yangilangan sozlamalar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─────────────────────────────────────────────
  # Reports
  # ─────────────────────────────────────────────
  /reports/summary:
    get:
      tags: [Reports]
      summary: Dashboard uchun umumiy statistika (Admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Statistika
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      today:
                        type: string
                      activeRentals:
                        type: number
                      overdueRentals:
                        type: number
                      totalDebtors:
                        type: number
                      totalDebt:
                        type: number
                      equipmentStats:
                        type: object
                        properties:
                          totalOut:
                            type: number
                          totalAvailable:
                            type: number
                      todayStats:
                        type: object
                        properties:
                          newRentals:
                            type: number
                          closedRentals:
                            type: number
                          paymentsReceived:
                            type: number
                          newClients:
                            type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/monthly:
    get:
      tags: [Reports]
      summary: Oylik hisobot (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
            example: 2025
        - name: month
          in: query
          schema:
            type: integer
            example: 6
      responses:
        "200":
          description: Oylik hisobot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      period:
                        type: string
                        example: "2025-06"
                      revenue:
                        type: number
                      newRentals:
                        type: number
                      closedRentals:
                        type: number
                      newClients:
                        type: number
                      paymentsReceived:
                        type: number
                      topClients:
                        type: array
                        items:
                          type: object
                          properties:
                            fullName:
                              type: string
                            totalPaid:
                              type: number
                      topEquipment:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            rentalCount:
                              type: number
                      dailyRevenue:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            amount:
                              type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/overdue:
    get:
      tags: [Reports]
      summary: Muddati o'tgan arendalar (Admin + Worker)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Muddati o'tgan arendalar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rentalNumber:
                          type: string
                        client:
                          type: object
                          properties:
                            fullName:
                              type: string
                            phone:
                              type: string
                        expectedEndDate:
                          type: string
                          format: date
                        overdueDays:
                          type: number
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              equipmentName:
                                type: string
                              activeQuantity:
                                type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
