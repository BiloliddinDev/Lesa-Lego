openapi: 3.0.3

info:
  title: Lesa-Lego API
  description: >
    Qurilish jihozlarini ijaraga berish boshqaruv tizimi uchun REST API.
    Telegram WebApp orqali autentifikatsiya qilinadi.
  version: 1.0.0

servers:
  - url: http://localhost:5000/api
    description: Local development
  - url: https://lesa-lego-backend.fly.dev/api
    description: Production

# ─────────────────────────────────────────────
# Umumiy komponentlar (qayta ishlatiladigan qismlar)
# ─────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        POST /auth/telegram orqali olingan JWT token.
        Header: Authorization: Bearer <token>

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: AUTH_USER_NOT_FOUND
            message:
              type: string
              example: Siz tizimga qo'shilmagansiz
            fields:
              type: object
              description: Faqat VALIDATION_ERROR bo'lganda keladi
              additionalProperties:
                type: array
                items:
                  type: string

    User:
      type: object
      properties:
        _id:
          type: string
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        telegramId:
          type: number
          example: 123456789
        name:
          type: string
          example: Alisher Karimov
        username:
          type: string
          example: alisher_k
        phoneNumber:
          type: string
          example: "+998901234567"
        avatarUrl:
          type: string
          example: ""
        role:
          type: string
          enum: [ADMIN, WORKER]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserWithStats:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            stats:
              type: object
              properties:
                totalRentalsCreated:
                  type: number
                  example: 12
                totalPaymentsAdded:
                  type: number
                  example: 8
                lastActivity:
                  type: string
                  format: date-time
                  nullable: true

    CreateUserInput:
      type: object
      required: [telegramId, name, role]
      properties:
        telegramId:
          type: number
          example: 987654321
        name:
          type: string
          example: Bobur Toshmatov
        username:
          type: string
          example: bobur_t
        role:
          type: string
          enum: [WORKER]

    UpdateUserInput:
      type: object
      properties:
        name:
          type: string
          example: Bobur Toshmatov
        isActive:
          type: boolean
          example: false

    AuditLogEntry:
      type: object
      properties:
        action:
          type: string
          example: rental.create
        resourceType:
          type: string
          example: rental
        resourceName:
          type: string
          example: ARN-2025-0012
        createdAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Lesa
        description:
          type: string
        isActive:
          type: boolean
        order:
          type: number
        createdAt:
          type: string
          format: date-time

    Equipment:
      type: object
      properties:
        _id:
          type: string
        category:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
        name:
          type: string
          example: Lesa A-seriya 2m
        description:
          type: string
        totalQuantity:
          type: number
          example: 10
        rentedQuantity:
          type: number
          example: 4
        availableQuantity:
          type: number
          example: 6
        dailyRate:
          type: number
          example: 5000
        isActive:
          type: boolean

    Client:
      type: object
      properties:
        _id:
          type: string
        fullName:
          type: string
          example: Vohid Rahimov
        phone:
          type: string
          example: "+998977654321"
        telegramId:
          type: number
        address:
          type: string
        note:
          type: string
        totalDebt:
          type: number
          example: 250000
        isActive:
          type: boolean
        createdBy:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
        createdAt:
          type: string
          format: date-time

    Rental:
      type: object
      properties:
        _id:
          type: string
        rentalNumber:
          type: string
          example: ARN-2025-0005
        client:
          $ref: "#/components/schemas/Client"
        createdBy:
          $ref: "#/components/schemas/User"
        items:
          type: array
          items:
            type: object
            properties:
              equipmentName:
                type: string
              equipmentCategory:
                type: string
              quantity:
                type: number
              dailyRate:
                type: number
              returnedQuantity:
                type: number
        startDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, overdue, completed]
        depositAmount:
          type: number
        paidAmount:
          type: number
        deliveryLocation:
          type: object
          description: Yetkazish joylashuvi (xarita koordinatalari)
          properties:
            lat:
              type: number
              example: 41.311081
            lng:
              type: number
              example: 69.240562
            label:
              type: string
              example: Chilonzor 5-uy
        note:
          type: string

    Payment:
      type: object
      properties:
        _id:
          type: string
        rental:
          type: object
          properties:
            _id:
              type: string
            rentalNumber:
              type: string
        client:
          type: object
          properties:
            _id:
              type: string
            fullName:
              type: string
        amount:
          type: number
          example: 300000
        method:
          type: string
          enum: [cash, card, transfer]
        note:
          type: string
        createdBy:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
        createdAt:
          type: string
          format: date-time

    CreatePaymentInput:
      type: object
      required: [rentalId, amount, method]
      properties:
        rentalId:
          type: string
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        amount:
          type: number
          example: 300000
        method:
          type: string
          enum: [cash, card, transfer]
        note:
          type: string
          example: Naqd to'lov

    Debt:
      type: object
      properties:
        _id:
          type: string
        client:
          type: object
          properties:
            _id:
              type: string
            fullName:
              type: string
            phone:
              type: string
        rental:
          type: object
          properties:
            _id:
              type: string
            rentalNumber:
              type: string
        amount:
          type: number
          example: 450000
        dueDate:
          type: string
          format: date-time
          nullable: true
        paidDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, paid, overdue]
        note:
          type: string

    CreateDebtInput:
      type: object
      required: [clientId, rentalId, amount]
      properties:
        clientId:
          type: string
        rentalId:
          type: string
        amount:
          type: number
          example: 450000
        dueDate:
          type: string
          format: date-time
        note:
          type: string

    PayDebtInput:
      type: object
      required: [amount, method]
      properties:
        amount:
          type: number
          example: 450000
        method:
          type: string
          enum: [cash, card, transfer]
        note:
          type: string

    Settings:
      type: object
      properties:
        _id:
          type: string
        companyName:
          type: string
          example: Lesa Lego MChJ
        ownerName:
          type: string
          example: Karimov Alisher
        address:
          type: string
          example: Toshkent sh, Chilonzor t, 5-uy
        phone:
          type: string
          example: "+998 90 123 45 67"
        inn:
          type: string
        bankAccount:
          type: string
        bankName:
          type: string
        logoBase64:
          type: string
          nullable: true
        stampBase64:
          type: string
          nullable: true
        signatureBase64:
          type: string
          nullable: true
        contractTemplate:
          type: string
        rentalTerms:
          type: string

    DevLoginInput:
      type: object
      description: >
        telegramId yoki userId dan birini yuborish kerak.
        Faqat development muhitida ishlaydi.
      properties:
        telegramId:
          type: number
          description: Telegram ID orqali login
          example: 123456789
        userId:
          type: string
          description: User ID orqali login
          example: 64f1a2b3c4d5e6f7a8b9c0d1

    DevSetupInput:
      type: object
      description: >
        DB bo'sh bo'lganda birinchi admin user yaratish.
        Faqat development muhitida ishlaydi.
      properties:
        name:
          type: string
          description: Admin ismi (default: Admin)
          example: Super Admin
        telegramId:
          type: number
          description: Telegram ID (default: 1)
          example: 123456789

    DevLoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            _id:
              type: string
            telegramId:
              type: number
            name:
              type: string
            role:
              type: string
              enum: [ADMIN, WORKER]
            isActive:
              type: boolean

  responses:
    Unauthorized:
      description: Token yo'q, noto'g'ri yoki muddati o'tgan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Foydalanuvchi tizimda yo'q yoki role ruxsat bermaydi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resurs topilmadi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Ma'lumotlar noto'g'ri
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

# ─────────────────────────────────────────────
# Endpointlar
# ─────────────────────────────────────────────
tags:
  - name: Auth
    description: Telegram WebApp orqali autentifikatsiya
  - name: Dev
    description: Development mode autentifikatsiya (faqat development muhitida ishlaydi)
  - name: Users
    description: Xodimlarni boshqarish (faqat Admin)
  - name: Categories
    description: Jihoz kategoriyalari
  - name: Equipment
    description: Jihozlar (asbob-uskunalar)
  - name: Clients
    description: Mijozlar
  - name: Rentals
    description: Arendalar (ijara)
  - name: Payments
    description: To'lovlar
  - name: Debts
    description: Qarzdorlar
  - name: Settings
    description: Kompaniya sozlamalari (faqat Admin)
  - name: Reports
    description: Hisobotlar
  - name: Health
    description: Server holatini tekshirish

paths:
  /auth/telegram:
    post:
      tags: [Auth]
      summary: Telegram initData orqali login qilish
      description: >
        WebApp ochilganda frontend `window.Telegram.WebApp.initData`
        ni shu endpointga yuboradi. Backend HMAC-SHA256 orqali tekshiradi,
        DB dan userni topadi va JWT qaytaradi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData:
                  type: string
                  example: "query_id=AAHdF6IQ...&user=%7B%22id%22%3A123...&auth_date=1719648000&hash=a1b2c3..."
      responses:
        "200":
          description: Muvaffaqiyatli login
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          description: initData yuborilmagan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: initData noto'g'ri yoki 24 soatdan eski
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Foydalanuvchi DB da yo'q (admin hali qo'shmagan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      tags: [Auth]
      summary: Joriy foydalanuvchi ma'lumotlarini olish
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Foydalanuvchi ma'lumotlari
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─────────────────────────────────────────────
  # Dev Auth (faqat development mode)
  # ─────────────────────────────────────────────
  /auth/dev-users:
    get:
      tags: [Dev]
      summary: Development mode — foydalanuvchilar ro'yxati
      description: >
        ⚠️ **FAQAT DEVELOPMENT MUHITIDA ISHLAYDI.**
        Brauzerda simulyatsiya qilish uchun mavjud foydalanuvchilarni qaytaradi.
        `NODE_ENV=development` bo'lgandagina ishlaydi.
      security: []
      responses:
        "200":
          description: Foydalanuvchilar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        telegramId:
                          type: number
                        name:
                          type: string
                        role:
                          type: string
                          enum: [ADMIN, WORKER]
                        isActive:
                          type: boolean

  /auth/dev-login:
    post:
      tags: [Dev]
      summary: Development mode — Telegram WebAppsiz token olish
      description: >
        ⚠️ **FAQAT DEVELOPMENT MUHITIDA ISHLAYDI.**
        Brauzerda API test qilish uchun `telegramId` yoki `userId` yuborilsa,
        JWT token qaytariladi.
        `NODE_ENV=development` bo'lgandagina ishlaydi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginInput"
      responses:
        "200":
          description: Muvaffaqiyatli login
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DevLoginResponse"
        "400":
          description: telegramId yoki userId yuborilmagan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Foydalanuvchi topilmadi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/dev-setup:
    post:
      tags: [Dev]
      summary: Development mode — birinchi admin user yaratish
      description: >
        ⚠️ **FAQAT DEVELOPMENT MUHITIDA ISHLAYDI.**
        DB bo'sh bo'lganda birinchi ADMIN user yaratadi va JWT token qaytaradi.
        Agar tizimda allaqachon userlar bo'lsa, xato qaytaradi.
        `NODE_ENV=development` bo'lgandagina ishlaydi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevSetupInput"
      responses:
        "201":
          description: Admin user yaratildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DevLoginResponse"
        "400":
          description: Tizimda allaqachon foydalanuvchilar bor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users:
    get:
      tags: [Users]
      summary: Barcha foydalanuvchilar (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: isActive
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, WORKER]
      responses:
        "200":
          description: Foydalanuvchilar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Users]
      summary: Yangi xodim qo'shish (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Yaratilgan foydalanuvchi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Bu telegramId allaqachon bor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{id}:
    get:
      tags: [Users]
      summary: Bitta xodim + statistika (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Foydalanuvchi ma'lumotlari
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserWithStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Users]
      summary: Xodim ma'lumotlarini yangilash (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Yangilangan foydalanuvchi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/audit:
    get:
      tags: [Users]
      summary: Xodimning barcha amallarini ko'rish (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
            example: rental.create
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Audit log ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  total:
                    type: number
                  page:
                    type: number
                  totalPages:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me:
    get:
      tags: [Users]
      summary: O'zining ma'lumotlarini olish (har qanday login qilgan user)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Joriy foydalanuvchi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Users]
      summary: O'z ma'lumotini yangilash (har qanday login qilgan user)
      description: >
        Worker ham, Admin ham faqat o'zining `name` maydonini o'zgartira oladi.
        `role` va `isActive` ni o'ziga o'zi berish mumkin emas — buni faqat
        Admin `PATCH /users/{id}` orqali qila oladi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Bobur Toshmatov
      responses:
        "200":
          description: Yangilangan foydalanuvchi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      tags: [Health]
      summary: Server va DB holatini tekshirish
      description: Deploy monitoring (masalan Fly.io health check) uchun ishlatiladi
      security: []
      responses:
        "200":
          description: Server ishlayapti
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: connected
                  uptime:
                    type: number
                    example: 3600
                  timestamp:
                    type: string
                    format: date-time

  # ─────────────────────────────────────────────
  # Categories
  # ─────────────────────────────────────────────
  /categories:
    get:
      tags: [Categories]
      summary: Barcha kategoriyalar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kategoriyalar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Categories]
      summary: Yangi kategoriya qo'shish (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Lesa
                description:
                  type: string
                  example: Qurilish lesalari
                order:
                  type: number
                  example: 1
      responses:
        "201":
